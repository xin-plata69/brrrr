<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Brazo Robótico</title>
<style>
:root{--bg:#10141a;--card:#1a212b;--tx:#e8edf3;--mut:#8a97a8;--ac:#3ea6ff;--ok:#2ecc71;--bad:#e74c3c;--warn:#f1c40f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:14px;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;max-width:520px;margin:auto}
h1{font-size:18px;margin:0 0 10px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}
.lbl{display:flex;justify-content:space-between;font-size:14px;color:var(--mut);margin-bottom:6px}
.lbl b{color:var(--tx)}
input[type=range]{width:100%;height:36px;accent-color:var(--ac)}
button{border:0;border-radius:12px;padding:16px 10px;font-size:16px;font-weight:600;color:#fff;background:#2c3745;flex:1;touch-action:manipulation}
button:active{filter:brightness(1.3)}
button:disabled{opacity:.4}
.ac{background:var(--ac)}.ok{background:var(--ok)}.warn{background:#d68910}
.stop{background:var(--bad);font-size:20px;padding:22px}
#st{font-size:13px;color:var(--mut)}
#st.on{color:var(--ok)}
#log{font:12px monospace;color:var(--mut);height:70px;overflow:auto;white-space:pre-wrap}
</style>
</head>
<body>
<h1>🦾 Brazo Robótico</h1>

<div class="card">
  <div class="row"><button id="bConn" class="ac">Conectar Bluetooth</button></div>
  <div id="st" style="margin-top:8px">Desconectado</div>
  <div style="margin-top:6px;font-size:14px">Estado: <b id="estado">—</b></div>
</div>

<div class="card" id="sliders"></div>

<div class="card">
  <div class="row" style="margin-bottom:8px">
    <button id="bHome" class="warn">🏠 Origen</button>
    <button id="bAuto" class="ok">▶ Rutina</button>
  </div>
  <button id="bStop" class="stop" style="width:100%">⛔ PARADA SEGURA</button>
  <button id="bReset" class="ac" style="width:100%;margin-top:8px" disabled>↺ Rehabilitar (RESET)</button>
</div>

<div class="card"><div id="log"></div></div>

<script>
/* ================= CONFIGURACIÓN ================= */
const SERVICE = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const RX_CHAR = "6e400002-b5a3-f393-e0a9-e50e24dcca9e"; // app -> Arduino
const TX_CHAR = "6e400003-b5a3-f393-e0a9-e50e24dcca9e"; // Arduino -> app (notificaciones)
const SERVOS = [   // locked:true = servo inmovilizado (si lo usas, debe coincidir con ART1_FIJO del .ino)
  {id:1, name:"Art. 1 · Hombro",        min:0,  max:180, init:81},
  {id:2, name:"Art. 2 · Codo",          min:0,  max:180, init:77},
  {id:3, name:"Art. 3 · Muñeca",        min:0,  max:180, init:95},
  {id:4, name:"Pinza",                  min:30, max:100, init:30}
];
// La rutina A->B y la FSM viven en el Arduino (ver brazo_robotico.ino, arreglo RUTINA).
/* ================================================== */

let rx = null, tx = null, device = null, lastLog = "";
const $ = id => document.getElementById(id);
const enc = new TextEncoder(), dec = new TextDecoder();
const sleep = ms => new Promise(r => setTimeout(r, ms));
const log = t => { if (t === lastLog) return; lastLog = t; const l=$("log"); l.textContent += t+"\n"; l.scrollTop=l.scrollHeight; };

SERVOS.forEach(s => {
  const d = document.createElement("div");
  d.style.marginBottom = "10px";
  d.innerHTML = `<div class="lbl"><span>${s.name}</span><b id="v${s.id}">${s.init}°</b></div>
    <input type="range" id="s${s.id}" min="${s.min}" max="${s.max}" value="${s.init}" ${s.locked?"disabled":""}>`;
  $("sliders").appendChild(d);
  let last = 0;
  $("s"+s.id).addEventListener("input", e => {
    $("v"+s.id).textContent = e.target.value + "°"; mostrarAngulos();
    const now = Date.now();
    if (now - last > 50) { last = now; send(`S${s.id}:${e.target.value}`); }
  });
  $("s"+s.id).addEventListener("change", e => send(`S${s.id}:${e.target.value}`));
});
const angEl = document.createElement("div");
angEl.style.cssText = "font:13px monospace;color:var(--mut);margin-top:4px";
$("sliders").appendChild(angEl);
function mostrarAngulos(){ angEl.textContent = "Ángulos: {" + SERVOS.map(s => $("s"+s.id).value).join(", ") + "}"; }
function setSlider(id, val){ $("s"+id).value = val; $("v"+id).textContent = val + "°"; mostrarAngulos(); }
mostrarAngulos();

/* ---- Estado de la FSM (reportado por el Arduino) ---- */
function setState(s){
  const colores = {MANUAL:"var(--ok)", AUTO:"var(--ac)", HOMING:"var(--warn)", ESTOP:"var(--bad)"};
  $("estado").textContent = s;
  $("estado").style.color = colores[s] || "var(--mut)";
  $("bReset").disabled = (s !== "ESTOP");
  $("bAuto").disabled = $("bHome").disabled = (s !== "MANUAL");
}
setState("—");

/* ---- Envío y recepción ---- */
async function send(cmd, reliable=false){
  if (!rx) return false;
  const d = enc.encode(cmd + "\n");
  try {
    if (reliable || !rx.properties.writeWithoutResponse) await rx.writeValueWithResponse(d);
    else await rx.writeValueWithoutResponse(d);
    return true;
  } catch(e){ log("Error al enviar: " + e.message); return false; }
}

function onNotify(e){
  const m = dec.decode(e.target.value).trim();
  if (m.startsWith("ST:")) setState(m.slice(3));
  else if (m.startsWith("P:")) m.slice(2).split(",").map(Number).forEach((v,i) => setSlider(i+1, v));
  log("◀ " + m);
}

async function conectar(dev){
  const server = await dev.gatt.connect();
  const svc = await server.getPrimaryService(SERVICE);
  rx = await svc.getCharacteristic(RX_CHAR);
  tx = await svc.getCharacteristic(TX_CHAR);
  await tx.startNotifications();
  tx.addEventListener("characteristicvaluechanged", onNotify);
  $("st").textContent = "Conectado a " + (dev.name || "Arduino");
  $("st").className = "on";
  $("bConn").textContent = "Reconectar";
  await send("?");
}

$("bConn").onclick = async () => {
  if (!navigator.bluetooth){ alert("Usa Chrome en Android (o Bluefy en iPhone): este navegador no soporta Web Bluetooth."); return; }
  try {
    device = await navigator.bluetooth.requestDevice({ filters:[{services:[SERVICE]}], optionalServices:[SERVICE] });
    device.addEventListener("gattserverdisconnected", async () => {
      rx = tx = null;
      $("st").textContent = "Desconectado"; $("st").className = "";
      setState("DESCONECTADO");
      log("Conexión perdida: el brazo se detuvo (ESTOP)");
      for (let i = 1; i <= 5 && !rx; i++){        // recuperación: reintentos automáticos
        log(`Reintentando ${i}/5...`);
        await sleep(2000);
        try { await conectar(device); log("Reconectado. Pulsa RESET para continuar"); } catch(e){}
      }
    });
    await conectar(device);
  } catch(e){ log("No se pudo conectar: " + e.message); }
};

/* ---- Botones ---- */
$("bHome").onclick  = () => { SERVOS.forEach(s => setSlider(s.id, s.init)); send("HOME"); };
$("bAuto").onclick  = () => send("AUTO");
$("bStop").onclick  = () => send("STOP", true);
$("bReset").onclick = () => send("RESET", true);
</script>
</body>
</html>
